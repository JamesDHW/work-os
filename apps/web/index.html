<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1014" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>work-os</title>
    <script>
      // Pre-paint theme: avoids a flash before the app sets data-theme.
      document.documentElement.dataset.theme =
        localStorage.getItem("work-os.theme") ?? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
